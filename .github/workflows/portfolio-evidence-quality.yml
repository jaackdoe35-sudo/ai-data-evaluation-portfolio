name: Portfolio evidence quality
on:
  pull_request:
    paths: ['index.html','README.md','RECRUITER-OVERVIEW.md','20-llm-security-evaluation/**','21-ai-governance-and-assurance/**','scripts/validate_portfolio_site.py','.github/workflows/portfolio-evidence-quality.yml']
  push:
    branches: [main]
    paths: ['index.html','README.md','RECRUITER-OVERVIEW.md','20-llm-security-evaluation/**','21-ai-governance-and-assurance/**','scripts/validate_portfolio_site.py','.github/workflows/portfolio-evidence-quality.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_portfolio_site.py
      - working-directory: 21-ai-governance-and-assurance
        run: |
          python validator.py
          python -m unittest discover -s tests -v
      - working-directory: 20-llm-security-evaluation
        run: |
          python validator.py
          python -m unittest discover -s tests -v
