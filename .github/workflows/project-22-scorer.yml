name: Project 22 Blind Assessment Scorer

on:
  pull_request:
    paths:
      - "22-production-style-assessment/**"
      - ".github/workflows/project-22-scorer.yml"
  push:
    branches:
      - main
    paths:
      - "22-production-style-assessment/**"
      - ".github/workflows/project-22-scorer.yml"

jobs:
  scorer-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run blind assessment scorer regression tests
        run: python -m unittest discover -s 22-production-style-assessment/tests -v
      - name: Compile assessment scorer
        run: python -m py_compile 22-production-style-assessment/score_submission.py
