name: Portfolio Tool Verification

on:
  pull_request:
    branches: [main]
    paths:
      - "01-ai-response-evaluation/**"
      - "02-data-annotation/**"
      - "03-quality-assurance/**"
      - "04-transcription/**"
      - "05-skills/**"
      - "06-paired-response-challenge/**"
      - "07-advanced-blind-evaluation/**"
      - "08-realistic-response-review/**"
      - "09-end-to-end-annotation-case-study/**"
      - "10-annotation-csv-validator/**"
      - "11-annotation-consistency-checker/**"
      - "12-ai-response-score-calculator/**"
      - "13-annotation-qa-dashboard/**"
      - "14-search-relevance-evaluation/**"
      - "15-semantic-and-reference-audit/**"
      - "16-annotation-qa-stress-test/**"
      - "20-llm-security-evaluation/**"
      - "README.md"
      - "RECRUITER-OVERVIEW.md"
      - ".github/workflows/portfolio-tool-verification.yml"
  push:
    branches: [main]
    paths:
      - "01-ai-response-evaluation/**"
      - "02-data-annotation/**"
      - "03-quality-assurance/**"
      - "04-transcription/**"
      - "05-skills/**"
      - "06-paired-response-challenge/**"
      - "07-advanced-blind-evaluation/**"
      - "08-realistic-response-review/**"
      - "09-end-to-end-annotation-case-study/**"
      - "10-annotation-csv-validator/**"
      - "11-annotation-consistency-checker/**"
      - "12-ai-response-score-calculator/**"
      - "13-annotation-qa-dashboard/**"
      - "14-search-relevance-evaluation/**"
      - "15-semantic-and-reference-audit/**"
      - ".github/workflows/portfolio-tool-verification.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify Python tools and datasets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - "10-annotation-csv-validator"
          - "11-annotation-consistency-checker"
          - "12-ai-response-score-calculator"
          - "13-annotation-qa-dashboard"
          - "14-search-relevance-evaluation"
          - "20-llm-security-evaluation"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python source
        if: matrix.project != '14-search-relevance-evaluation'
        run: python -m py_compile $(find "${{ matrix.project }}" -maxdepth 1 -name '*.py' -print)

      - name: Run unit tests
        working-directory: ${{ matrix.project }}
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          else
            echo "No unit-test directory found"
            exit 1
          fi

      - name: Exercise command-line tool with sample data
        if: matrix.project != '14-search-relevance-evaluation'
        working-directory: ${{ matrix.project }}
        run: |
          case "${{ matrix.project }}" in
            10-annotation-csv-validator)
              set +e
              output=$(python validator.py sample_annotations.csv 2>&1)
              status=$?
              set -e
              printf '%s\\n' "$output"
              test "$status" -eq 1
              grep -q "invalid primary_intent" <<< "$output"
              grep -q "duplicate record_id" <<< "$output"
              grep -q "requires redaction token" <<< "$output"
              ;;
            11-annotation-consistency-checker)
              set +e
              output=$(python consistency_checker.py sample_annotations.csv 2>&1)
              status=$?
              set -e
              printf '%s\\n' "$output"
              test "$status" -eq 1
              grep -q "identical message text has conflicting" <<< "$output"
              grep -q "does not match expected token" <<< "$output"
              grep -q "intent_unclear is paired" <<< "$output"
              ;;
            12-ai-response-score-calculator)
              python score_calculator.py sample_evaluations.csv --output /tmp/evaluation-summary.md
              test -s /tmp/evaluation-summary.md
              ;;
            13-annotation-qa-dashboard)
              python qa_dashboard.py sample_annotations.csv --output /tmp/annotation-dashboard.html
              test -s /tmp/annotation-dashboard.html
              ;;
            20-llm-security-evaluation)
              python validator.py
              ;;
          esac

      - name: Upload generated report
        if: matrix.project == '13-annotation-qa-dashboard'
        uses: actions/upload-artifact@v4
        with:
          name: annotation-qa-dashboard
          path: /tmp/annotation-dashboard.html

  audit-portfolio:
    name: Audit portfolio datasets and internal links
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify datasets, reported statistics and internal Markdown links
        run: |
          python - <<'PY'
          import csv
          import math
          import re
          from collections import Counter
          from pathlib import Path

          root = Path(".")
          def load(path):
              with path.open(encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          def require(condition, message):
              if not condition:
                  raise AssertionError(message)
              print("PASS:", message)

          # Main response-evaluation dataset and reported score statistics.
          p = Path("01-ai-response-evaluation/evaluated-responses.csv")
          rows = load(p)
          require(len(rows) == 30, "response-evaluation dataset has 30 rows")
          require(len({r["id"] for r in rows}) == len(rows), "response-evaluation IDs are unique")
          dims = ["factuality", "instruction_following", "completeness", "clarity", "safety_judgment"]
          for r in rows:
              scores = [float(r[k]) for k in dims]
              require_score = all(1 <= x <= 5 for x in scores)
              if not require_score:
                  raise AssertionError(f"out-of-range dimension score: {r['id']}")
              expected = round(sum(scores) / len(scores), 1)
              if not math.isclose(float(r["overall_mean"]), expected, abs_tol=1e-9):
                  raise AssertionError(f"overall_mean mismatch for {r['id']}")
          require(True, "all response-evaluation scores and row means are valid")
          dimension_means = {d: sum(float(r[d]) for r in rows) / len(rows) for d in dims}
          expected_dimensions = {"factuality": 3.53, "instruction_following": 3.80,
                                 "completeness": 3.63, "clarity": 4.70, "safety_judgment": 4.23}
          require(all(round(dimension_means[k], 2) == v for k, v in expected_dimensions.items()),
                  "response-evaluation dimension means match findings report")
          mean = sum(float(r["overall_mean"]) for r in rows) / len(rows)
          require(round(mean, 2) == 3.98, "response-evaluation overall mean matches findings report")
          severity = Counter(r["issue_severity"] for r in rows)
          require(severity == {"None": 15, "Major": 10, "Minor": 4, "Critical": 1},
                  "response-evaluation severity counts match findings report")

          # Introductory annotation dataset.
          rows = load(Path("02-data-annotation/annotated-dataset.csv"))
          require(len(rows) == 50, "introductory annotation dataset has 50 rows")
          require(len({r["id"] for r in rows}) == len(rows), "introductory annotation IDs are unique")
          require(all(r["message"].strip() and r["annotation_rationale"].strip() for r in rows),
                  "introductory annotation messages and rationales are populated")
          require(all(r["intent"] in {"account_access", "billing", "cancellation", "feedback",
                                     "other", "product_information", "shipping", "technical_support"}
                      and r["sentiment"] in {"positive", "neutral", "negative", "mixed"} for r in rows),
                  "introductory annotation labels match the documented taxonomy")
          require(Counter(r["intent"] for r in rows) ==
                  {"account_access": 6, "billing": 9, "cancellation": 5, "feedback": 8,
                   "other": 2, "product_information": 6, "shipping": 7, "technical_support": 7},
                  "introductory annotation intent counts match QA report")
          require(Counter(r["sentiment"] for r in rows) ==
                  {"mixed": 3, "negative": 20, "neutral": 21, "positive": 6},
                  "introductory annotation sentiment counts match QA report")

          # End-to-end annotation case study.
          rows = load(Path("09-end-to-end-annotation-case-study/annotated_dataset.csv"))
          require(len(rows) == 40, "end-to-end annotation dataset has 40 rows")
          require(len({r["record_id"] for r in rows}) == len(rows), "end-to-end annotation IDs are unique")
          require(all(r["message_text"].strip() and r["annotation_rationale"].strip() for r in rows),
                  "end-to-end messages and rationales are populated")
          allowed = {
              "primary_intent": {"account_access", "account_closure", "profile_update", "card_activation",
                  "card_delivery", "card_replacement_address", "card_not_working", "card_payment_declined",
                  "contactless_payment_issue", "card_payment_dispute", "card_bill_payment_status",
                  "card_retained_by_atm", "lost_card", "suspected_fraud", "cash_withdrawal_dispute",
                  "withdrawal_limit", "withdrawal_limit_change", "transfer_status", "transfer_information",
                  "transfer_cancellation", "transfer_reversal_request", "transfer_reference_issue",
                  "duplicate_transaction", "duplicate_charge", "fee_information", "refund_status",
                  "pin_help", "intent_unclear"},
              "sentiment": {"positive", "neutral", "negative", "mixed"},
              "urgency": {"routine", "standard", "elevated", "urgent"},
              "pii_types": {"none", "phone", "email", "card_last4"},
              "clarification_flag": {"yes", "no"},
          }
          for field, values in allowed.items():
              invalid = [r["record_id"] for r in rows if r[field] not in values]
              require(not invalid, f"end-to-end {field} values are valid")
          for r in rows:
              pii, span = r["pii_types"], r["pii_span_to_redact"]
              require((pii == "none" and span == "") or
                      (pii != "none" and span in {"[PHONE]", "[EMAIL]", "[LAST4]"}),
                      f"PII tag/span consistent for {r['record_id']}")
              require((pii == "none" and not any(t in r["message_text"] for t in
                      ("[PHONE]", "[EMAIL]", "[LAST4]"))) or
                      (pii != "none" and span in r["message_text"]),
                      f"PII token appears in source message for {r['record_id']}")
          counts = Counter(r["urgency"] for r in rows)
          require(counts == {"standard": 14, "routine": 9, "elevated": 9, "urgent": 8},
                  "end-to-end urgency distribution matches QA report")
          require(sum(r["clarification_flag"] == "yes" for r in rows) == 6,
                  "end-to-end clarification count matches QA report")
          require(Counter(r["sentiment"] for r in rows) == {"negative": 24, "neutral": 16},
                  "end-to-end sentiment distribution matches QA report")
          require(Counter(r["pii_types"] for r in rows) ==
                  {"none": 37, "phone": 1, "email": 1, "card_last4": 1},
                  "end-to-end PII distribution matches QA report")
          require(Counter(r["primary_intent"] for r in rows) ==
                  {"account_access": 2, "account_closure": 1, "card_activation": 1,
                   "card_bill_payment_status": 1, "card_delivery": 2, "card_not_working": 1,
                   "card_payment_declined": 1, "card_payment_dispute": 1,
                   "card_replacement_address": 1, "card_retained_by_atm": 1,
                   "cash_withdrawal_dispute": 1, "contactless_payment_issue": 1,
                   "duplicate_charge": 1, "duplicate_transaction": 1, "fee_information": 3,
                   "intent_unclear": 3, "lost_card": 1, "pin_help": 1, "profile_update": 1,
                   "refund_status": 2, "suspected_fraud": 4, "transfer_cancellation": 1,
                   "transfer_information": 1, "transfer_reference_issue": 1,
                   "transfer_reversal_request": 1, "transfer_status": 3,
                   "withdrawal_limit": 1, "withdrawal_limit_change": 1},
                  "end-to-end primary intent counts match QA report")

          # Completed realistic response-review worksheet.
          rows = load(Path("08-realistic-response-review/evaluation-results.csv"))
          require(len(rows) == 6 and len({r["case_id"] for r in rows}) == 6,
                  "realistic response-review results contain six unique cases")
          require(all(r["final_preference"] in {"A", "B", "Tie"} for r in rows),
                  "realistic response-review preferences are valid")
          for r in rows:
              for field, value in r.items():
                  if "_1_to_5" in field and value:
                      require(1 <= int(value) <= 5, f"{r['case_id']} {field} is within 1–5")

          # Search relevance practice dataset and summary.
          rows = load(Path("14-search-relevance-evaluation/search_relevance_dataset.csv"))
          require(len(rows) == 20 and len({r["case_id"] for r in rows}) == 20,
                  "search relevance dataset has 20 unique cases")
          require(all(r["intent_type"] in {"informational", "navigational", "transactional", "local"}
                      and r["relevance_grade"] in {"0", "1", "2", "3"}
                      and r["rationale"].strip() for r in rows),
                  "search relevance labels, grades and rationales are valid")
          require(Counter(r["relevance_grade"] for r in rows) ==
                  {"3": 10, "2": 3, "1": 5, "0": 2},
                  "search relevance grade distribution matches QA summary")
          require(Counter(r["intent_type"] for r in rows) ==
                  {"informational": 10, "navigational": 4, "transactional": 3, "local": 3},
                  "search relevance intent distribution matches QA summary")

          # Check relative Markdown links and image references within repository.
          broken = []
          for md in root.rglob("*.md"):
              if ".git" in md.parts:
                  continue
              text = md.read_text(encoding="utf-8")
              for target in re.findall(r"!?(?:\[[^\]]*\])\(([^)]+)\)", text):
                  target = target.strip().split()[0].strip("<>")
                  if not target or target.startswith(("https://", "http://", "mailto:", "#", "data:")):
                      continue
                  target = target.split("#", 1)[0]
                  if not target:
                      continue
                  resolved = (md.parent / target).resolve()
                  if not resolved.exists():
                      broken.append(f"{md}: {target}")
          require(not broken, "all relative Markdown links resolve" if not broken else
                  "broken Markdown links: " + "; ".join(broken))
          print("Portfolio dataset and link audit completed.")
          PY
